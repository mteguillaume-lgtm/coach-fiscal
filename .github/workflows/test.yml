name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Aligné sur le poste de dev (Node 26) : pdfjs-dist v5 utilise des
          # APIs récentes (Promise.try, Uint8Array.toHex) absentes de Node ≤ 24.
          node-version: 26
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests unitaires
        run: npx vitest run
